<head><script>try{document.documentElement.dataset.theme=localStorage.getItem('noor_theme_mode_v882')==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث نور الذكر V92.1.1</title>
<style>body{display:grid;place-items:center;min-height:100vh;margin:0;background:var(--noor-bg);color:var(--noor-text)}.box{width:min(560px,calc(100% - 28px));padding:30px;text-align:center;background:var(--noor-surface);border:1px solid var(--noor-border);border-radius:var(--noor-radius-xl);box-shadow:var(--noor-shadow-md)}.box h1{color:var(--noor-primary-strong)}.box b{color:var(--noor-primary)}</style>

<body><div class="box"><h1>تحديث ملفات نور الذكر</h1><p id="m">جاري حذف النسخ القديمة من المتصفح…</p></div>
<script>
(async()=>{
 const m=document.getElementById('m');
 const release=window.NOOR_VERSION||{assetVersion:'92.1.1',cachePrefix:'noor-aldhikr-'};
 try{
  if('serviceWorker' in navigator){const scope=new URL('./',location.href).href;const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.filter(r=>r.scope===scope).map(r=>r.unregister()));}
  if('caches' in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith(release.cachePrefix)).map(k=>caches.delete(k)));}
  localStorage.removeItem('noor-sw-reload');
  m.textContent='تم تنظيف الكاش. سيتم فتح لوحة المالك الآن.';
  setTimeout(()=>location.replace('portal.html?v='+encodeURIComponent(release.assetVersion)+'&t='+Date.now()),700);
 }catch(e){m.textContent='تعذر تنظيف كاش نور الذكر تلقائيًا. افتح portal.html?v='+release.assetVersion+' يدويًا.';}
})();
</script><script defer src="assets/js/v913-theme-engine.js?v=92.1.1"></script></body></html>
