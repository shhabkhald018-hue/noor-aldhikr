<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث نور الذكر</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7f6;color:#13211c;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:560px;padding:28px;text-align:center;background:white;border:1px solid #dfe9e5;border-radius:20px}b{color:#176b52}</style></head>
<body><div class="box"><h1>تحديث ملفات نور الذكر</h1><p id="m">جاري حذف النسخ القديمة من المتصفح…</p></div>
<script>
(async()=>{
 const m=document.getElementById('m');
 try{
  if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}
  if('caches' in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('noor-')).map(k=>caches.delete(k)));}
  localStorage.removeItem('noor-sw-reload');
  m.innerHTML='<b>تم تنظيف الكاش.</b><br>سيتم فتح لوحة المالك الآن.';
  setTimeout(()=>location.replace('portal.html?v=83.0&t='+Date.now()),700);
 }catch(e){m.textContent='تعذر تنظيف الكاش تلقائيًا. افتح portal.html?v=83.0 يدويًا.';}
})();
</script></body></html>
