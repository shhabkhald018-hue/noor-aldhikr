<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تشخيص Supabase | نور الذكر</title><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/v67-balanced-theme.css?v=82.0"><style>body{background:#f5f8f7}.diag{max-width:760px;margin:50px auto;padding:22px}.diag-card{background:#fff;border:1px solid #dbe8e3;border-radius:18px;padding:20px;margin:12px 0}.good{color:#176b52}.bad{color:#a21b3c}.wait{color:#6b7d77}code{direction:ltr;display:inline-block}</style></head><body><main class="diag"><h1>تشخيص اتصال Supabase</h1><p>هذه الصفحة لا تعدّل قاعدة البيانات. هي فقط تحدد أين يتوقف الاتصال.</p><div class="diag-card"><b>الإصدار</b><div id="version">—</div></div><div class="diag-card"><b>إعدادات config.js</b><div id="config" class="wait">جاري الفحص…</div><div id="projectRef" class="muted" style="margin-top:8px"></div></div><div class="diag-card"><b>الوصول إلى نطاق Supabase</b><div id="network" class="wait">جاري الفحص…</div></div><div class="diag-card"><b>مكتبة Supabase JS</b><div id="library" class="wait">جاري الفحص…</div></div><div class="diag-card"><a class="btn" href="portal.html?v=82.0">العودة إلى لوحة المالك</a></div></main><script src="assets/js/config.js?v=82.0"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2'"></script><script>
(async()=>{const $=id=>document.getElementById(id),cfg=window.NOOR_CONFIG||{};$('version').textContent=cfg.appVersion||'غير معروف';let valid=false;try{const u=new URL(cfg.supabaseUrl||'');valid=u.protocol==='https:'&&u.hostname.endsWith('.supabase.co')&&/^sb_publishable_/.test(cfg.publishableKey||'')}catch{}$('config').textContent=valid?'✓ الرابط وPublishable Key موجودان بصيغة صحيحة.':'✗ إعدادات config.js غير صحيحة أو ناقصة.';$('config').className=valid?'good':'bad';try{$('projectRef').textContent='Project Ref: '+new URL(cfg.supabaseUrl).hostname.split('.')[0]}catch{}$('library').textContent=window.supabase?.createClient?'✓ مكتبة Supabase JS تم تحميلها.':'✗ تعذر تحميل مكتبة Supabase JS من شبكات CDN.';$('library').className=window.supabase?.createClient?'good':'bad';if(!valid){$('network').textContent='لم يبدأ الاختبار لأن config غير صالح.';$('network').className='bad';return}const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),9000);try{const r=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/auth/v1/health',{headers:{apikey:cfg.publishableKey},cache:'no-store',signal:ctrl.signal});clearTimeout(timer);$('network').textContent=(r.status===401||r.status===403)?'✗ النطاق متاح لكن المفتاح مرفوض.':'✓ نطاق Supabase متاح. HTTP '+r.status;$('network').className=(r.status===401||r.status===403)?'bad':'good'}catch(e){clearTimeout(timer);$('network').textContent=e?.name==='AbortError'?'✗ انتهت مهلة الاتصال. افحص الشبكة أو DNS.':'✗ فشل الوصول إلى نطاق Supabase. غالبًا DNS/شبكة/حجب نطاق.';$('network').className='bad'}})();
</script></body></html>
