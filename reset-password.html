<!doctype html>
<html lang="ar" dir="rtl">
<head><script>try{document.documentElement.dataset.theme=localStorage.getItem('noor_theme_mode_v882')==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#176B52">
  <title>تعيين كلمة مرور جديدة | نور الذكر</title>
  <link rel="icon" href="icon.svg">

  <link rel="stylesheet" href="assets/css/v69-production-polish.css?v=92.0.3">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .reset-card{width:min(560px,100%);background:var(--noor-surface);border:1px solid var(--noor-border);border-radius:22px;padding:26px;box-shadow:0 20px 55px rgba(0,0,0,.12)}
    .reset-card h1{margin:0 0 8px;font-size:30px}
    .reset-card p{color:var(--noor-text-soft);line-height:1.8}
    .field{margin:16px 0}.field label{display:block;font-weight:800;margin-bottom:8px}
    .field input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid var(--noor-border);font:inherit;background:var(--noor-surface);color:var(--noor-text)}
    .btnx{width:100%;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:900;cursor:pointer;background:var(--noor-primary);color:#fff}
    .msg{margin-top:14px;padding:12px;border-radius:10px;display:none}.msg.show{display:block}.msg.err{background:color-mix(in srgb,var(--noor-danger) 10%,var(--noor-surface));color:var(--noor-danger)}.msg.ok{background:color-mix(in srgb,var(--noor-success) 10%,var(--noor-surface));color:var(--noor-success)}
    .muted{font-size:14px}
  </style>
  <script src="config.js?v=92.0.3"></script>
  <script src="assets/js/error-handler.js?v=92.0.3"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.112.4"><\/script>')}</script>

<link rel="stylesheet" href="assets/css/v87-components.css?v=92.0.3">
<link rel="stylesheet" href="assets/css/v87-pages.css?v=92.0.3">
<link rel="stylesheet" href="assets/css/v88-tokens.css?v=92.0.3">
<link rel="stylesheet" href="assets/css/v88-core.css?v=92.0.3">
<link rel="stylesheet" href="assets/css/v913-theme.css?v=92.0.3">
</head>
<body class="auth-page">
  <main class="reset-card auth-card">
    <div class="v87-auth-brand">☾ نور الذكر</div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p>اكتب كلمة المرور الجديدة مرتين، وبعد نجاح التحديث سننقلك إلى الصفحة الرئيسية.</p>

    <div class="field">
      <label for="pw1">كلمة المرور الجديدة</label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="8">
    </div>
    <div class="field">
      <label for="pw2">تأكيد كلمة المرور</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8">
    </div>
    <button class="btnx" id="savePw" type="button">حفظ كلمة المرور الجديدة</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <p class="muted">إذا ظهر أن الرابط منتهي الصلاحية، اطلب رسالة استعادة جديدة من Supabase ثم افتح أحدث رسالة فقط.</p>
  </main>

<script>
window.addEventListener('load', async () => {
  const msg = document.getElementById('msg');
  const show = (t, ok=false) => {
    msg.textContent=t; msg.className='msg show '+(ok?'ok':'err');
  };
  const safeError = (error,fallback) => window.NOOR_ERROR_HANDLER?.report?.(error,'password-recovery',fallback)||fallback;

  if(!window.supabase || !window.NOOR_CONFIG?.supabaseUrl || !window.NOOR_CONFIG?.publishableKey){
    show('تعذر تحميل إعدادات الاتصال بـ Supabase.');
    return;
  }

  const sb = window.supabase.createClient(
    window.NOOR_CONFIG.supabaseUrl,
    window.NOOR_CONFIG.publishableKey
  );

  // يدعم روابط Recovery بنظام implicit أو PKCE.
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const accessToken = hash.get('access_token');
  const refreshToken = hash.get('refresh_token');
  const code = new URLSearchParams(location.search).get('code');

  try{
    if(code){
      const {error}=await sb.auth.exchangeCodeForSession(code);
      if(error) throw error;
      history.replaceState(null,'',location.pathname);
    } else if(accessToken && refreshToken){
      const {error} = await sb.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });
      if(error) throw error;
      history.replaceState(null,'',location.pathname);
    } else {
      const {data:{session}} = await sb.auth.getSession();
      if(!session){
        show('رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رسالة جديدة.');
        return;
      }
    }
  }catch(e){
    show(safeError(e,'تعذر فتح جلسة الاستعادة. اطلب رابطًا جديدًا ثم حاول مرة أخرى.'));
    return;
  }

  document.getElementById('savePw').addEventListener('click', async () => {
    const p1=document.getElementById('pw1').value;
    const p2=document.getElementById('pw2').value;
    if(p1.length<8){ show('كلمة المرور يجب ألا تقل عن 8 أحرف.'); return; }
    if(p1!==p2){ show('كلمتا المرور غير متطابقتين.'); return; }

    const btn=document.getElementById('savePw');
    btn.disabled=true; btn.textContent='جارٍ الحفظ...';
    try{
      const {error}=await sb.auth.updateUser({password:p1});
      if(error)throw error;
      show('تم تغيير كلمة المرور بنجاح. سيتم فتح الصفحة الرئيسية الآن.', true);
      setTimeout(()=>location.href='index.html',1200);
    }catch(error){
      show(safeError(error,'تعذر تغيير كلمة المرور الآن. حاول مرة أخرى.'));
      btn.disabled=false; btn.textContent='حفظ كلمة المرور الجديدة';
    }
  });
});
</script>
<script defer src="assets/js/v913-theme-engine.js?v=92.0.3"></script></body>
</html>
