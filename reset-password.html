<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#2f735e">
  <title>تعيين كلمة مرور جديدة | نور الذكر</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="assets/css/v67-balanced-theme.css?v=81.7">
  <link rel="stylesheet" href="assets/css/v69-production-polish.css?v=81.7">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .reset-card{width:min(560px,100%);background:var(--noor-surface,#fff);border:1px solid var(--noor-border,#ddd);border-radius:22px;padding:26px;box-shadow:0 20px 55px rgba(0,0,0,.12)}
    .reset-card h1{margin:0 0 8px;font-size:30px}
    .reset-card p{color:var(--noor-text-2,#666);line-height:1.8}
    .field{margin:16px 0}.field label{display:block;font-weight:800;margin-bottom:8px}
    .field input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid var(--noor-border,#ccc);font:inherit;background:var(--noor-bg,#fff);color:var(--noor-text,#111)}
    .btnx{width:100%;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:900;cursor:pointer;background:#2f735e;color:#fff}
    .msg{margin-top:14px;padding:12px;border-radius:10px;display:none}.msg.show{display:block}.msg.err{background:#fff1f1;color:#9b2c2c}.msg.ok{background:#eefaf4;color:#176b4d}
    .muted{font-size:14px}
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2'"></script>
  <script defer src="assets/js/config.js?v=81.7"></script>
</head>
<body>
  <main class="reset-card">
    <div style="font-weight:900;color:#2f735e">نور الذكر</div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p>اكتب كلمة المرور الجديدة مرتين، وبعد نجاح التحديث سننقلك مباشرة إلى لوحة المالك.</p>

    <div class="field">
      <label for="pw1">كلمة المرور الجديدة</label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="8">
    </div>
    <div class="field">
      <label for="pw2">تأكيد كلمة المرور</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8">
    </div>
    <button class="btnx" id="savePw" type="button">حفظ كلمة المرور الجديدة</button>
    <div id="msg" class="msg"></div>
    <p class="muted">إذا ظهر أن الرابط منتهي الصلاحية، اطلب رسالة استعادة جديدة من Supabase ثم افتح أحدث رسالة فقط.</p>
  </main>

<script>
window.addEventListener('load', async () => {
  const msg = document.getElementById('msg');
  const show = (t, ok=false) => {
    msg.textContent=t; msg.className='msg show '+(ok?'ok':'err');
  };

  if(!window.supabase || !window.NOOR_CONFIG?.supabaseUrl || !window.NOOR_CONFIG?.publishableKey){
    show('تعذر تحميل إعدادات الاتصال بـ Supabase.');
    return;
  }

  const sb = window.supabase.createClient(
    window.NOOR_CONFIG.supabaseUrl,
    window.NOOR_CONFIG.publishableKey
  );

  // يدعم روابط Recovery بنظام implicit أو PKCE.
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const accessToken = hash.get('access_token');
  const refreshToken = hash.get('refresh_token');
  const code = new URLSearchParams(location.search).get('code');

  try{
    if(code){
      const {error}=await sb.auth.exchangeCodeForSession(code);
      if(error) throw error;
      history.replaceState(null,'',location.pathname);
    } else if(accessToken && refreshToken){
      const {error} = await sb.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });
      if(error) throw error;
      history.replaceState(null,'',location.pathname);
    } else {
      const {data:{session}} = await sb.auth.getSession();
      if(!session){
        show('رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رسالة جديدة.');
        return;
      }
    }
  }catch(e){
    show('تعذر فتح جلسة الاستعادة: '+(e?.message||e));
    return;
  }

  document.getElementById('savePw').addEventListener('click', async () => {
    const p1=document.getElementById('pw1').value;
    const p2=document.getElementById('pw2').value;
    if(p1.length<8){ show('كلمة المرور يجب ألا تقل عن 8 أحرف.'); return; }
    if(p1!==p2){ show('كلمتا المرور غير متطابقتين.'); return; }

    const btn=document.getElementById('savePw');
    btn.disabled=true; btn.textContent='جارٍ الحفظ...';
    const {error}=await sb.auth.updateUser({password:p1});
    if(error){
      show('تعذر تغيير كلمة المرور: '+(error.message||error));
      btn.disabled=false; btn.textContent='حفظ كلمة المرور الجديدة';
      return;
    }
    show('تم تغيير كلمة المرور بنجاح. سيتم فتح لوحة المالك الآن.', true);
    setTimeout(()=>location.href='portal.html',1200);
  });
});
</script>
</body>
</html>
